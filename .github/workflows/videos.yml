name: Videos
on:
  pull_request:
    paths: [content/videos.json]
  push:
    branches: [main]
    paths: [content/videos.json]
jobs:
  check-videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check-videos
